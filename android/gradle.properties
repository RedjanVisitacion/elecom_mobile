org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024m
# Pub's cache is on C: while this project is on F:. Kotlin incremental
# caches cannot relativize source paths across those Windows drive roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
